# Push a tag like v0.1.0 to build the Windows app and publish it as a GitHub Release.
# The tag must match `version` in pyproject.toml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ZIP: plumpick-${{ github.ref_name }}-windows-x64.zip
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Check tag matches pyproject version
        shell: bash
        run: |
          version="v$(uv version --short)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - run: uv sync --locked

      - run: uv run pytest

      # The prebuilt PyInstaller bootloader is a known antivirus false-positive trigger (many
      # malware samples use the same binary). Compiling it here gives the exe its own.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile the PyInstaller bootloader from source
        shell: bash
        run: |
          runw=.venv/Lib/site-packages/PyInstaller/bootloader/Windows-64bit-intel/runw.exe
          stock=$(sha256sum "$runw")
          version=$(uv run --no-sync python -c "from importlib.metadata import version; print(version('pyinstaller'))")
          # --no-cache: otherwise uv may reuse a cached wheel that holds the prebuilt bootloader.
          # TEMP/TMP: the default temp dir is spelled both RUNNER~1 and runneradmin, and waf mixes
          # the two when it works out relative source paths, so it cannot find zlib/*.c.
          TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" PYINSTALLER_COMPILE_BOOTLOADER=1 uv pip install \
            --reinstall-package pyinstaller --no-cache --no-binary pyinstaller "pyinstaller==$version"
          if [ "$stock" = "$(sha256sum "$runw")" ]; then
            echo "The bootloader was not recompiled"
            exit 1
          fi

      # --no-sync: `uv run` would otherwise put the prebuilt PyInstaller back.
      - run: uv run --no-sync python scripts/build.py

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/plumpick -DestinationPath $env:ZIP

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "Plumpick $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Windows 10/11, 64-bit. Unzip \`$ZIP\` anywhere and run \`plumpick/plumpick.exe\` (keep the \`_internal\` folder next to it). No Python needed.

          The exe is not code-signed, so Windows SmartScreen may warn on first launch: click **More info** → **Run anyway**."
